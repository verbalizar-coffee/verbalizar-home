<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CUP COMPASS ／ 今日の一杯を直す</title>
<meta name="description" content="薄い、苦い、雑味が出る。つまずきごとに30秒でできる対処を先に置き、粉の中で何が起きているかを断面図で見せます。">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Zen+Old+Mincho:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
@charset "utf-8";
/* ==========================================================================
   CUP COMPASS ／ 共通デザインシステム
   紙は白。書体は明朝で統一（数値と符号のみ等幅）。
   色は水彩画から採取：墨 #16262A／藍 #16495D／実 #A9302A／葉 #4E6B4A／陽 #C98A2E
   ========================================================================== */
:root{
 --paper:#FFFFFF;
 --ink:#16262A;
 --soft:#5C7072;
 --faint:#8C9C9D;
 --line:#E3E8E7;
 --line-2:#CFDADB;
 --indigo:#16495D;
 --indigo-m:#3E7C93;
 --cherry:#A9302A;
 --cherry-d:#8E241F;
 --leaf:#4E6B4A;
 --sun:#C98A2E;
 --w-blue:#E9F1F4; --w-green:#E7EFE7; --w-sun:#FBF0DA; --w-red:#F8E7E3;

 --fd:"Zen Old Mincho","Hiragino Mincho ProN",serif;   /* 見出しと本文 */
 --fl:"Cormorant Garamond",serif;                       /* 欧文の銘 */
 --fm:"IBM Plex Mono",monospace;                        /* 数値・符号 */

 --w:1180px; --gap:24px; --sec:88px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;overflow-x:clip;background:var(--paper);color:var(--ink);
 font-family:var(--fd);font-weight:400;font-size:16px;line-height:1.95;letter-spacing:.015em;
 -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,h4,h5{font-family:var(--fd);font-weight:600;margin:0;line-height:1.45;letter-spacing:.01em}
p{margin:0}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--indigo);outline-offset:3px;border-radius:2px}

.wrap{max-width:var(--w);margin:0 auto;padding:0 28px}
.mono{font-family:var(--fm);font-size:11.5px;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--fm);font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--indigo-m)}
.note{font-size:13.5px;color:var(--soft);line-height:1.85}
.stat{font-family:var(--fm);font-size:28px;font-weight:500;line-height:1.2;letter-spacing:0}
.src{font-family:var(--fm);font-size:10px;letter-spacing:.06em;color:var(--faint)}

/* ---------- ヘッダー ---------- */
header.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.93);
 backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:var(--w);margin:0 auto;padding:12px 28px;display:flex;
 justify-content:space-between;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:12px;flex:0 0 auto}
.brand .seal{width:34px;height:34px;position:relative;display:grid;place-items:center;flex:0 0 auto}
.brand .seal svg{position:absolute;inset:0;width:100%;height:100%}
.brand .seal b{position:relative;font-family:var(--fl);font-weight:400;font-size:16px;color:var(--indigo);line-height:1}
.brand .name{font-family:var(--fl);font-weight:300;letter-spacing:.28em;font-size:18px;white-space:nowrap}
.brand .sub{font-family:var(--fm);font-size:9.5px;letter-spacing:.14em;color:var(--faint)}
.tabs{display:flex;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button,.tabs a{background:none;border:0;padding:8px 14px;font-size:14.5px;color:var(--soft);
 cursor:pointer;white-space:nowrap;position:relative;font-family:var(--fd);border-bottom:2px solid transparent}
.tabs button:hover,.tabs a:hover{color:var(--indigo)}
.tabs button[aria-current="true"],.tabs a[aria-current="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--cherry)}

/* ---------- 面 ---------- */
.pane{display:none;padding:34px 0 90px}
.pane.on{display:block}
.h-sec{font-size:31px;margin-top:10px;line-height:1.4}
.lead{margin-top:14px;color:var(--soft);font-size:16px;max-width:68ch;line-height:2}
.shead{display:flex;align-items:baseline;gap:16px;margin-bottom:24px}
.shead h2{font-size:25px}
.shead .rule{flex:1;height:1px;background:var(--line)}

/* ---------- 箱 ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:22px}
.card.feature{background:linear-gradient(170deg,var(--w-blue),#fff 62%);border-color:#CFE0E6}
.card.tint{background:#FCFDFD}
.grid{display:grid;gap:20px}
.stage{border:1px solid var(--line);border-radius:8px;background:#fff;overflow:hidden}
.scene-frame{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}

/* ---------- 操作 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
 border:1px solid var(--cherry);background:var(--cherry);color:#fff;padding:12px 22px;
 font-size:15px;border-radius:2px;transition:.18s;font-family:var(--fd);letter-spacing:.03em}
.btn:hover{background:var(--cherry-d);border-color:var(--cherry-d)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-2)}
.btn.ghost:hover{border-color:var(--indigo);color:var(--indigo);background:var(--w-blue)}
.btn.ink{background:var(--indigo);border-color:var(--indigo);color:#fff}
.btn.ink:hover{background:#0E3345;border-color:#0E3345}
.btn.sm{padding:8px 14px;font-size:13.5px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:1px solid var(--line-2);background:#fff;padding:7px 14px;font-size:13.5px;
 border-radius:999px;cursor:pointer;color:var(--soft);font-family:var(--fd);transition:.16s}
.chips button:hover{border-color:var(--indigo-m);color:var(--indigo)}
.chips button[aria-pressed="true"]{background:var(--indigo);color:#fff;border-color:var(--indigo)}
select,input[type=text],input[type=number],textarea{width:100%;padding:11px 12px;border:1px solid var(--line-2);
 background:#fff;border-radius:2px;font-size:15px;font-family:var(--fd)}
input[type=range]{width:100%;accent-color:var(--indigo);height:24px}
label.f{display:block;margin-top:12px}
label.f>span{display:block;font-size:13px;color:var(--soft);margin-bottom:5px}
.rowlab{display:flex;justify-content:space-between;gap:12px;font-size:14px;align-items:baseline;margin-top:12px}
.rowlab b{font-family:var(--fm);font-size:13px;color:var(--indigo);font-weight:500}

/* ---------- 符号 ---------- */
.pill{font-family:var(--fm);font-size:10px;letter-spacing:.06em;border:1px solid var(--line-2);
 padding:2px 8px;border-radius:999px;color:var(--soft);display:inline-block;line-height:1.7}
.pill.good{border-color:var(--leaf);color:var(--leaf)}
.pill.warn{border-color:var(--cherry);color:var(--cherry)}
.pill.brass{border-color:var(--indigo-m);color:var(--indigo)}
.callout{border-left:3px solid var(--indigo);padding:13px 16px;background:var(--w-blue);
 font-size:14.5px;color:var(--ink);border-radius:0 4px 4px 0}
.callout.warn{border-color:var(--cherry);background:var(--w-red)}
.callout.good{border-color:var(--leaf);background:var(--w-green)}
.bar{height:7px;background:var(--line);position:relative;border-radius:4px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--indigo-m);display:block}

/* ---------- 表 ---------- */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--fm);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
 color:var(--faint);font-weight:400}

/* ---------- 部品 ---------- */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--soft);margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.lib{border:1px solid var(--line);background:#fff;border-radius:6px;padding:15px;display:block;transition:.16s}
.lib:hover{border-color:var(--indigo-m);background:var(--w-blue)}
.hidden{display:none}

footer{border-top:1px solid var(--line);padding:30px 0 70px;color:var(--soft);font-size:13px;margin-top:var(--sec)}

/* ---------- 立ち上がり ---------- */
.rise{opacity:0;transform:translateY(12px);animation:rise .7s cubic-bezier(.2,.7,.3,1) forwards}
.rise:nth-child(2){animation-delay:.08s}.rise:nth-child(3){animation-delay:.16s}
@keyframes rise{to{opacity:1;transform:none}}

@media (max-width:1000px){
 :root{--sec:62px}
 .grid{grid-template-columns:1fr!important}
 .h-sec{font-size:25px}
}
@media (max-width:560px){
 body{font-size:15.5px}
 .wrap{padding:0 20px}
 .top-in{padding:10px 20px;gap:10px}
 .brand .name{font-size:13px;letter-spacing:.1em}
 .brand .seal{width:28px;height:28px}
 .brand .sub{display:none}
 .tabs button,.tabs a{padding:7px 8px;font-size:13px}
 .card{padding:18px}
 .h-sec{font-size:23px}
}
@media (prefers-reduced-motion:reduce){
 *{animation:none!important;transition:none!important}
 .rise{opacity:1;transform:none}
}

</style>
<style>
:root{--w:1240px}
.news{border:1px solid var(--line);background:#fff;border-radius:8px;padding:18px;display:block;transition:.16s}
.news:hover{border-color:var(--indigo-m);background:#FCFDFD;transform:translateY(-2px)}
.news h4{font-size:16px;line-height:1.6}
.news .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:9px}
.news .impact{font-size:13.5px;color:var(--ink);border-top:1px solid var(--line);margin-top:11px;padding-top:9px;line-height:1.85}
.cat{display:flex;gap:12px;align-items:baseline;margin:30px 0 12px;flex-wrap:wrap}
.cat h3{font-size:20px;padding-left:11px}
.cat span{font-size:13px;color:var(--soft)}
.tip{border:1px solid var(--line);background:#fff;border-radius:8px;overflow:hidden;margin-bottom:14px}
.tip summary{cursor:pointer;padding:18px 20px;list-style:none;display:flex;gap:16px;align-items:flex-start}
.tip summary::-webkit-details-marker{display:none}
.tip[open]{border-color:var(--cherry)}
.tip .hook{font-size:18px;font-weight:600;line-height:1.6}
.tip .fix{font-size:13.5px;color:var(--cherry);margin-top:5px}
.tip .bodyw{padding:0 20px 20px;display:grid;grid-template-columns:1fr .88fr;gap:20px;align-items:start}
.tip .fig{background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px}
@media (max-width:900px){.tip .bodyw{grid-template-columns:1fr}}
</style>

<body>
<header class="top"><div class="top-in">
 <div class="brand">
  <span class="seal" aria-hidden="true"><svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="15.5" fill="#E9F1F4"/>
   <circle cx="17" cy="17" r="15.5" fill="none" stroke="#3E7C93" stroke-width="1" stroke-dasharray="2 3" opacity=".8"/></svg><b>C</b></span>
  <span><span class="name">CUP COMPASS</span><br><span class="sub">v0.7 ／ 今日の一杯を直す</span></span>
 </div>
 <nav class="tabs" id="tabs"></nav>
</div></header>
<main>
 <section class="pane on" id="p-tips"><div class="wrap" id="c-tips"></div></section>
 <section class="pane" id="p-brew"><div class="wrap" id="c-brew"></div></section>
 <section class="pane" id="p-news"><div class="wrap" id="c-news"></div></section>
</main>
<footer><div class="wrap">掲載記事は編集部が選定した外部情報源へのリンクです。要約は当方によるもので、正確な内容は必ずリンク先の原典をご確認ください。相場・生産量は発表時点の値です。</div></footer>

<script>
/* ==========================================================================
   CUP COMPASS ／ 作画ライブラリ
   二つの画風だけを使う。混ぜない。
     WC … 水彩（産地・植物・風景・器）  下塗り→本塗り→縁の濃まり→墨線→しずく
     DG … 図解（抽出・断面・グラフ・地図）  白地に細い墨線と等幅の注記だけ
   ========================================================================== */
(function(global){
"use strict";

/* 決定論的な乱数（同じ種なら同じ絵になる） */
function rng(seed){let s=seed|0||1;return function(){s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);
  t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}

/* ---------------------------------------------------------------- 共通色 */
const C={
  ink:"#16262A", line:"#CFDADB", faint:"#8C9C9D",
  indigo:"#16495D", indigoM:"#3E7C93", indigoW:"#DCEAF0",
  cherry:"#A9302A", cherryL:"#C4453C",
  leaf:"#4E6B4A", leafL:"#6E8B54", leafD:"#38553B", leafY:"#8CA059",
  sun:"#C98A2E", sunW:"#F7E3B8",
  bark:"#6E5334", soil:"#8A5F3C", roast:"#7E4520",
  paper:"#FFFFFF"
};

/* ======================================================================
   WC ── 水彩
   ====================================================================== */
const WC={
 C:C,
 /* 一枚の絵につき一度だけ呼ぶ。id は絵ごとに変えること */
 defs(id){
  return `<defs>
   <filter id="wcE${id}" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.014 0.021" numOctaves="5" seed="${id*13+7}" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="16" xChannelSelector="R" yChannelSelector="G"/>
    <feGaussianBlur stdDeviation="0.7"/>
   </filter>
   <filter id="wcM${id}" x="-25%" y="-25%" width="150%" height="150%">
    <feTurbulence type="fractalNoise" baseFrequency="0.026 0.034" numOctaves="4" seed="${id*17+5}" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    <feGaussianBlur stdDeviation="0.5"/>
   </filter>
   <filter id="wcS${id}" x="-40%" y="-40%" width="180%" height="180%">
    <feTurbulence type="fractalNoise" baseFrequency="0.009" numOctaves="4" seed="${id*29+3}" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="26" xChannelSelector="R" yChannelSelector="G"/>
    <feGaussianBlur stdDeviation="7"/>
   </filter>
   <filter id="wcG${id}" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="${id*7+11}" result="g"/>
    <feColorMatrix in="g" type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.10"/></feComponentTransfer>
    <feComposite operator="in" in2="SourceGraphic"/>
   </filter>
  </defs>`;
 },
 /* 小さな形の本塗り（にじみを控えめに） */
 washM(id,d,color,op){
  const o=op==null?.86:op;
  return `<g filter="url(#wcM${id})"><path d="${d}" fill="${color}" opacity="${o}"/>`
   +`<path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" opacity="${Math.min(1,o+.1)}"/></g>`;
 },
 /* 紙のにじみ（背景に敷く淡い色だまり） */
 bloom(id,cx,cy,rx,ry,color,op){
  return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${color}" opacity="${op==null?.55:op}" filter="url(#wcS${id})"/>`;
 },
 /* 本塗り＋縁の濃まり。d は閉じたパス */
 wash(id,d,color,op,edge){
  const o=op==null?.82:op;
  return `<g filter="url(#wcE${id})"><path d="${d}" fill="${color}" opacity="${o}"/>`
   +(edge===false?"":`<path d="${d}" fill="none" stroke="${color}" stroke-width="2.4" opacity="${Math.min(1,o+.14)}"/>`)
   +`</g>`;
 },
 /* 葉：基部(0,0)から先端へ伸びる。角度は度 */
 leafPath(len,wide){
  const w=wide/2;
  return `M0,0 C${w*1.05},${-len*.22} ${w*.92},${-len*.68} 0,${-len} `
        +`C${-w*.92},${-len*.68} ${-w*1.05},${-len*.22} 0,0 Z`;
 },
 leaf(id,x,y,ang,len,wide,color,vein){
  const d=WC.leafPath(len,wide);
  return `<g transform="translate(${x},${y}) rotate(${ang})">
   ${WC.wash(id,d,color,.86)}
   <path d="M0,-2 C${wide*.06},${-len*.4} ${wide*.04},${-len*.72} 0,${-len+3}" fill="none"
     stroke="${vein||C.leafD}" stroke-width="1" opacity=".55"/>
   ${[.26,.44,.62,.78].map(t=>{const yy=-len*t, xx=wide*.40*(1-Math.abs(t-.5)*1.1);
     return `<path d="M0,${yy.toFixed(1)} q${(xx*.6).toFixed(1)},${(-len*.05).toFixed(1)} ${xx.toFixed(1)},${(-len*.10).toFixed(1)}
       M0,${yy.toFixed(1)} q${(-xx*.6).toFixed(1)},${(-len*.05).toFixed(1)} ${(-xx).toFixed(1)},${(-len*.10).toFixed(1)}"
       fill="none" stroke="${vein||C.leafD}" stroke-width=".7" opacity=".34"/>`;}).join("")}
   <path d="${d}" fill="none" stroke="${C.ink}" stroke-width=".9" opacity=".42"/></g>`;
 },
 /* コーヒーチェリー */
 cherry(id,x,y,r,ripe){
  const col=ripe===false?C.leafY:(r%2?C.cherry:C.cherryL);
  return `<g transform="translate(${x},${y})">
   ${WC.washM(id,`M0,${-r} a${r},${r} 0 1,0 .1,0 Z`,col,.9)}
   <circle r="${r}" fill="none" stroke="${C.ink}" stroke-width=".8" opacity=".45"/>
   <ellipse cx="${-r*.3}" cy="${-r*.34}" rx="${r*.3}" ry="${r*.22}" fill="#fff" opacity=".55"/></g>`;
 },
 /* 枝：葉が対生し、実が房になる */
 branch(id,x,y,h,ang,scale,seed){
  const r=rng(seed||9), s=scale||1;
  let o=`<g transform="translate(${x},${y}) rotate(${ang||0}) scale(${s})">`;
  o+=`<path d="M0,0 C${-h*.03},${-h*.35} ${h*.04},${-h*.7} 0,${-h}" fill="none"
       stroke="${C.bark}" stroke-width="${(3.4).toFixed(1)}" stroke-linecap="round"/>`;
  const n=5;
  for(let i=0;i<n;i++){
   const t=.18+i*(.78/n), yy=-h*t, L=h*(.30-.02*i)*(.85+r()*.3), W=L*.42;
   o+=WC.leaf(id, 2, yy, 62+r()*16, L, W, i%2?C.leaf:C.leafL);
   o+=WC.leaf(id,-2, yy,-62-r()*16, L, W, i%2?C.leafL:C.leafD);
   if(i>0&&i<n-1){
    const cr=h*.033;
    o+=WC.cherry(id, 7, yy+cr*.4, cr, r()>.25);
    o+=WC.cherry(id,-8, yy+cr*1.5, cr*.92, r()>.3);
   }
  }
  o+=WC.leaf(id,0,-h+2,4,h*.2,h*.085,C.leafL);
  return o+"</g>";
 },
 /* しずく（絵の下に落ちる縦の垂れ） */
 drip(x,y,len,color,w){
  const W=w||3;
  return `<g opacity=".55"><path d="M${x-W/2},${y} L${x+W/2},${y} L${x+W*.3},${y+len} L${x-W*.3},${y+len} Z" fill="${color}"/>
   <circle cx="${x}" cy="${y+len}" r="${W*.75}" fill="${color}"/></g>`;
 },
 /* 飛沫 */
 splash(cx,cy,spread,n,color,seed){
  const r=rng(seed||31);let o="";
  for(let i=0;i<n;i++){
   const a=r()*6.2832, d=Math.pow(r(),.6)*spread;
   o+=`<circle cx="${(cx+Math.cos(a)*d).toFixed(1)}" cy="${(cy+Math.sin(a)*d*.8).toFixed(1)}"
        r="${(.9+r()*2.6).toFixed(1)}" fill="${color}" opacity="${(.25+r()*.5).toFixed(2)}"/>`;
  }
  return o;
 },
 /* 紙の粒子（全体にうっすら） */
 grain(id,w,h){return `<rect width="${w}" height="${h}" fill="${C.ink}" filter="url(#wcG${id})" opacity=".5"/>`;}
};

/* ======================================================================
   DG ── 図解
   ====================================================================== */
const DG={
 C:C,
 defs(id){
  return `<defs>
   <marker id="dgA${id}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,1 L7,4 L0,7" fill="none" stroke="${C.indigo}" stroke-width="1.2" stroke-linecap="round"/></marker>
   <pattern id="dgH${id}" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
    <line x1="0" y1="0" x2="0" y2="6" stroke="${C.indigoM}" stroke-width="1" opacity=".35"/></pattern>
  </defs>`;
 },
 label(x,y,t,anchor,color,size){
  return `<text x="${x}" y="${y}" font-family="IBM Plex Mono, monospace" font-size="${size||9.5}"
   letter-spacing="1" text-anchor="${anchor||"start"}" fill="${color||C.faint}">${t}</text>`;
 },
 jp(x,y,t,anchor,color,size){
  return `<text x="${x}" y="${y}" font-family="Zen Old Mincho, serif" font-size="${size||12}"
   text-anchor="${anchor||"start"}" fill="${color||C.soft||"#5C7072"}">${t}</text>`;
 },
 leader(x1,y1,x2,y2){
  return `<path d="M${x1},${y1} L${x2},${y2}" fill="none" stroke="${C.line}" stroke-width="1"/>`;
 },
 /* 寸法線（縦） */
 dimV(id,x,y1,y2,t){
  return `<path d="M${x},${y1} L${x},${y2}" stroke="${C.indigoM}" stroke-width="1" stroke-dasharray="4 3"/>
   <path d="M${x-3},${y1+4} l3,-4 l3,4 M${x-3},${y2-4} l3,4 l3,-4" fill="none" stroke="${C.indigoM}" stroke-width="1"/>
   ${DG.label(x-7,(y1+y2)/2+3,t,"end",C.indigoM)}`;
 },
 grid(x,y,w,h,step){
  let o="";
  for(let gx=x;gx<=x+w+.1;gx+=step) o+=`<line x1="${gx}" y1="${y}" x2="${gx}" y2="${y+h}" stroke="${C.line}" stroke-width=".6" opacity=".7"/>`;
  for(let gy=y;gy<=y+h+.1;gy+=step) o+=`<line x1="${x}" y1="${gy}" x2="${x+w}" y2="${gy}" stroke="${C.line}" stroke-width=".6" opacity=".7"/>`;
  return o;
 },
 /* 粉の粒（断面図用・実寸比） */
 grains(x0,x1,y0,y1,n,d,seed,widthAt){
  const r=rng(seed||17);let o="";
  const list=[];
  for(let i=0;i<n;i++){
   const lg=Math.exp(Math.log(d)+(r()*2-1)*.62);
   list.push({u:r(),v:r(),size:Math.max(110,Math.min(2000,lg)),fine:lg<d*.42,tone:r()});
  }
  list.sort((a,b)=>(a.fine?1:0)-(b.fine?1:0));
  list.forEach(q=>{
   const y=y0+q.v*(y1-y0);
   const hw=widthAt?widthAt(y)/2-4:(x1-x0)/2;
   if(hw<3) return;
   const cx=widthAt?(x0+x1)/2+(q.u*2-1)*hw:x0+q.u*(x1-x0);
   const rr=Math.max(.9,Math.min(7,q.size/1250*8));
   const base=q.fine?[86,60,38]:[150,106,68];
   const sh=1-q.tone*.22;
   o+=`<circle cx="${cx.toFixed(1)}" cy="${y.toFixed(1)}" r="${rr.toFixed(1)}"
        fill="rgb(${Math.round(base[0]*sh)},${Math.round(base[1]*sh)},${Math.round(base[2]*sh)})"
        stroke="rgba(22,38,42,.35)" stroke-width=".5"/>`;
  });
  return o;
 }
};

<script>
/* ==========================================================================
   BLEND MODEL v0.4  —  「ブレンドは加重平均にならない」を計算で示すための最小モデル
   層1 焙煎化学   : 生豆組成 → 焙煎度pによる成分変換
   層2 粉砕物理   : 同一設定でも焙煎度で粒径が変わる（硬さの差）
   層3 抽出速度論 : 成分別の一次速度式（温度アレニウス・粒径逆比例）
   層4 知覚       : べき法則＋交差抑制（甘味が苦味を抑える等）
   ========================================================================== */
const BEANS=[
 {id:"et",name:"Ethiopia Yirgacheffe",short:"エチオピア",process:"ナチュラル",
  comp:{citric:9.0,malic:6.2,acetic:2.6,sucrose:80,cga:66,caffeine:12,lipid:150,poly:250,
        vol:{floral:9,fruity:8,nutty:2,cocoa:1,spice:1}}, hard:1.10},
 {id:"br",name:"Brazil Cerrado",short:"ブラジル",process:"パルプドナチュラル",
  comp:{citric:3.0,malic:3.0,acetic:1.4,sucrose:72,cga:54,caffeine:11,lipid:168,poly:262,
        vol:{floral:1,fruity:2,nutty:8,cocoa:6,spice:2}}, hard:0.92},
 {id:"co",name:"Colombia Huila",short:"コロンビア",process:"ウォッシュト",
  comp:{citric:6.2,malic:5.0,acetic:1.8,sucrose:76,cga:60,caffeine:13,lipid:156,poly:256,
        vol:{floral:3,fruity:4,nutty:5,cocoa:5,spice:2}}, hard:1.02},
 {id:"gt",name:"Guatemala Antigua",short:"グアテマラ",process:"ウォッシュト",
  comp:{citric:6.6,malic:5.4,acetic:1.7,sucrose:77,cga:62,caffeine:12.5,lipid:158,poly:258,
        vol:{floral:3,fruity:3,nutty:5,cocoa:5,spice:2}}, hard:1.05},
 {id:"su",name:"Sumatra Mandheling",short:"スマトラ",process:"スマトラ式",
  comp:{citric:1.8,malic:2.0,acetic:2.4,sucrose:66,cga:50,caffeine:12,lipid:178,poly:266,
        vol:{floral:0.5,fruity:1.5,nutty:4,cocoa:5,spice:7}}, hard:0.88}
];

/* --- 層1：焙煎度 p(0=浅 … 1=深) による成分変換 ------------------------- */
function roasted(bean,p){
  const c=bean.comp, e=Math.exp;
  const citric=c.citric*e(-2.2*p), malic=c.malic*e(-2.4*p);
  const acetic=c.acetic*(1+1.8*p*(1-p))*e(-0.5*p);
  const cga=c.cga*e(-1.9*p);                       // 残存クロロゲン酸
  const quinic=c.cga*0.34*Math.pow(p,1.2);         // 分解生成（渋・収れん）
  const lactone=c.cga*0.30*4*p*(1-p);              // 中煎りで極大（苦味の主役）
  const phenyl=c.cga*0.24*Math.pow(Math.max(0,p-0.45),1.5)*3.2; // 深煎りの重い苦味
  const sucrose=c.sucrose*e(-5.2*p);               // 中煎りでほぼ消える
  const caramel=c.sucrose*0.95*Math.pow(4*p*(1-p),0.8)+c.sucrose*0.10*p;
  const poly=c.poly*(0.80+0.26*p);                 // メラノイジン・多糖
  const fines=1+0.30*p;                            // 深煎りほど脆く微粉が増える
  const sol=0.86+0.24*p;                           // 可溶化しやすさ
  const vs=0.45+1.55*p-1.45*p*p;                   // 香気総量は中煎り付近で極大
  const v=c.vol;
  const vol={ floral:v.floral*e(-2.6*p)*vs, fruity:v.fruity*e(-1.7*p)*vs,
              nutty:v.nutty*(0.6+1.5*p*(1-0.5*p))*vs, cocoa:v.cocoa*(0.4+1.9*p*(1-0.4*p))*vs,
              spice:v.spice*(0.5+1.5*p)*vs, roasty:3.2*Math.pow(p,1.5)*vs };
  return {citric,malic,acetic,cga,quinic,lactone,phenyl,sucrose,caramel,poly,
          caffeine:c.caffeine,lipid:c.lipid,fines,sol,vol,p,hard:bean.hard};
}

/* --- 層2＋3：粒径と抽出速度 ------------------------------------------- */
const K={citric:.0075,malic:.0075,acetic:.0085,quinic:.0060,cga:.0040,lactone:.0038,
         phenyl:.0022,sucrose:.0060,caramel:.0038,poly:.0025,caffeine:.0045,lipid:.0016};
const EA=35000, R=8.314, T0=273.15+93, D0=600;

function extractOne(rb,{d,temp,time,agit}){
  const di=d*(1+0.20*(0.5-rb.p))*rb.hard;
  const tf=Math.exp(EA/R*(1/T0-1/(273.15+temp)));
  const out={};
  for(const k in K){
    const keff=K[k]*(D0/di)*tf*agit*(0.85+0.30*rb.fines/1.2);
    out[k]=(rb[k]||0)*(1-Math.exp(-keff*time))*rb.sol;
  }
  out.lipid=(rb.lipid||0)*(1-Math.exp(-K.lipid*(D0/di)*tf*agit*time))*0.22;
  out._d=di;
  const retain=(0.55+0.45*(temp-78)/18)*Math.exp(-time/900);
  out.vol={}; let vt=0;
  for(const k in rb.vol){ out.vol[k]=rb.vol[k]*retain*rb.sol; vt+=out.vol[k]; }
  out._volTotal=vt;
  return out;
}

/* --- ブレンド：カップ内比率は投入比率と一致しない ---------------------- */
function simulate(recipe){
  const {dose,water,d,temp,time,agit=1.0,kh=25,retain=2.0}=recipe;
  const liquid=Math.max(1,water-dose*retain);
  const tot={}, cup=[]; let solidsMg=0;
  const keys=["citric","malic","acetic","quinic","cga","lactone","phenyl","sucrose","caramel","poly","caffeine","lipid"];
  keys.forEach(k=>tot[k]=0);
  const volTot={floral:0,fruity:0,nutty:0,cocoa:0,spice:0,roasty:0};
  recipe.parts.forEach(pt=>{
    if(pt.ratio<=0) return;
    const rb=roasted(pt.bean,pt.p), ex=extractOne(rb,{d,temp,time,agit});
    const g=dose*pt.ratio;
    let mine=0;
    keys.forEach(k=>{const m=(ex[k]||0)*g; tot[k]+=m; mine+=m;});
    for(const k in volTot) volTot[k]+=(ex.vol[k]||0)*g;
    solidsMg+=mine;
    cup.push({id:pt.bean.id,name:pt.bean.short,in:pt.ratio,mg:mine,d:ex._d,p:pt.p});
  });
  cup.forEach(c=>c.out=solidsMg?c.mg/solidsMg:0);
  const ey=solidsMg/(dose*1000)*100;
  const tds=solidsMg/(liquid*1000)*100;
  const conc={}; keys.forEach(k=>conc[k]=tot[k]/liquid);
  const volC={}; let volT=0; for(const k in volTot){volC[k]=volTot[k]/liquid; volT+=volC[k];}
  return {ey,tds,liquid,cup,conc,volC,volT,solidsMg};
}

/* --- 層4：知覚（べき法則＋交差抑制） ---------------------------------- */
const CAL={acidity:1.00,bitterness:1.00,sweetness:1.00,body:1.00,aroma:1.00};
const VW={floral:3.2,fruity:2.4,nutty:0.8,cocoa:0.9,spice:0.7,roasty:0.35};
function perceive(sim,{kh=25,bias={}}={}){
  const c=sim.conc, v=sim.volC;
  let vw=0; for(const k in VW) vw+=(v[k]||0)*VW[k];
  const acidRaw=Math.pow(c.citric*1.0+c.malic*0.95+c.acetic*1.6,0.81)*13.8;
  const bitRaw =Math.pow(c.caffeine*0.55+c.lactone*1.5+c.phenyl*4.0+c.cga*0.15+c.quinic*1.4,0.90)*2.95;
  const swRaw  =Math.pow(c.sucrose*1.0+c.caramel*1.0+c.poly*0.075,0.80)*2.55;
  const bodyRaw=Math.pow(c.poly*0.25+c.lipid*1.5,1.18)*1.50;
  const arRaw  =Math.pow(vw,0.72)*7.35;
  const buffer=1/(1+0.0085*kh);
  let acidity   =acidRaw*buffer-0.10*swRaw-0.16*bitRaw;
  let bitterness=bitRaw-0.18*swRaw+0.04*acidRaw;
  let sweetness =swRaw-0.14*bitRaw-0.04*acidRaw+0.25*(v.cocoa+v.fruity);
  let body      =bodyRaw+0.04*bitRaw;
  let aroma     =arRaw-0.04*bitRaw;
  const o={acidity,bitterness,sweetness,body,aroma};
  for(const k in o) o[k]=Math.max(0,Math.min(10,o[k]*CAL[k]+(bias[k]||0)));
  return o;
}

/* --- 参照：単品ごとの知覚を投入比率で加重平均した「素朴な予測」 -------- */
function linearBlend(recipe){
  const acc={acidity:0,bitterness:0,sweetness:0,body:0,aroma:0};
  recipe.parts.forEach(pt=>{
    if(pt.ratio<=0) return;
    const one=Object.assign({},recipe,{parts:[{bean:pt.bean,ratio:1,p:pt.p}]});
    const s=perceive(simulate(one),{kh:recipe.kh});
    for(const k in acc) acc[k]+=s[k]*pt.ratio;
  });
  return acc;
}

/* --- 不確実性：モンテカルロ ------------------------------------------- */
function jitter(v,pct,rnd){return v*(1+(rnd()*2-1)*pct);}
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
function montecarlo(recipe,n=180,seed=7){
  const rnd=mulberry(seed), axes=["acidity","bitterness","sweetness","body","aroma"], acc={};
  axes.forEach(a=>acc[a]=[]); const eys=[],tdss=[];
  for(let i=0;i<n;i++){
    const r=JSON.parse(JSON.stringify({dose:recipe.dose,water:recipe.water,d:recipe.d,temp:recipe.temp,time:recipe.time,agit:recipe.agit,kh:recipe.kh,retain:recipe.retain}));
    r.parts=recipe.parts.map(pt=>({bean:{...pt.bean,comp:JSON.parse(JSON.stringify(pt.bean.comp)),hard:jitter(pt.bean.hard,.05,rnd)},ratio:pt.ratio,p:Math.max(0,Math.min(1,jitter(pt.p,.07,rnd)))}));
    r.parts.forEach(pt=>{for(const k in pt.bean.comp){ if(typeof pt.bean.comp[k]==="number") pt.bean.comp[k]=jitter(pt.bean.comp[k],.08,rnd); }});
    r.d=jitter(r.d,.10,rnd); r.temp=r.temp+(rnd()*2-1)*1.5; r.time=jitter(r.time,.06,rnd);
    const s=perceive(simulate(r),{kh:r.kh});
    axes.forEach(a=>acc[a].push(s[a]));
    const sim=simulate(r); eys.push(sim.ey); tdss.push(sim.tds);
  }
  const pct=(arr,q)=>{const s=[...arr].sort((a,b)=>a-b);return s[Math.floor(q*(s.length-1))];};
  const out={};
  axes.forEach(a=>out[a]={lo:pct(acc[a],.05),hi:pct(acc[a],.95)});
  out.ey={lo:pct(eys,.05),hi:pct(eys,.95)}; out.tds={lo:pct(tdss,.05),hi:pct(tdss,.95)};
  return out;
}

/* --- 目標への最適化（粗いグリッド探索） ------------------------------- */
function optimize(target,beans,base){
  const best={score:1e9};
  const temps=[88,90,92,94], grinds=[450,520,600,680];
  const n=beans.length;
  const combos=[];
  if(n===2){ for(let a=0;a<=10;a++) combos.push([a/10,1-a/10]); }
  else { for(let a=0;a<=10;a++) for(let b=0;b<=10-a;b++) combos.push([a/10,b/10,(10-a-b)/10]); }
  combos.forEach(cb=>{
    temps.forEach(temp=>grinds.forEach(d=>{
      const r=Object.assign({},base,{temp,d,parts:beans.map((bp,i)=>({bean:bp.bean,ratio:cb[i],p:bp.p}))});
      const s=perceive(simulate(r),{kh:base.kh});
      let sc=0; for(const k in target) sc+=Math.pow((s[k]-target[k])*(k==="acidity"?1.2:1),2);
      if(sc<best.score) Object.assign(best,{score:sc,ratios:cb,temp,d,sensory:s});
    }));
  });
  return best;
}

/* --- 検証統計 --------------------------------------------------------- */
function binomTail(n,k,p){ let s=0; for(let i=k;i<=n;i++){ s+=comb(n,i)*Math.pow(p,i)*Math.pow(1-p,n-i); } return s; }
function comb(n,k){let r=1;for(let i=1;i<=k;i++)r=r*(n-k+i)/i;return r;}
function triangleCritical(n,alpha=0.05){ for(let k=Math.ceil(n/3);k<=n;k++){ if(binomTail(n,k,1/3)<=alpha) return k; } return n; }
function sampleSize(delta,sd,alpha=0.05,power=0.8){ const z=1.959964,zb=0.8416; return Math.ceil(2*Math.pow(z+zb,2)*sd*sd/(delta*delta)); }

const B={beanId:"br",p:.5,dose:15,d:550,temp:92,water:240,method:"drip",t:0,playing:false,speed:4,total:180};
const CLASSES=[["acid","酸（クエン酸・リンゴ酸）","#3E7C93",["citric","malic","acetic"]],
 ["sugar","糖・カラメル（甘さ）","#C98A2E",["sucrose","caramel"]],
 ["bitter","苦味（ラクトン・キナ酸）","#8E4A22",["lactone","quinic","caffeine","cga","phenyl"]],
 ["body","多糖・脂質（厚み）","#4E6B4A",["poly","lipid"]]];
const METH={drip:{label:"ドリッパー",total:180,agit:1.15,retain:2.0},
 press:{label:"フレンチプレス",total:240,agit:1.0,retain:2.2},
 siphon:{label:"サイフォン",total:150,agit:1.25,retain:2.0}};

function stateAt(t){
 const rb=roasted(BEANS.find(b=>b.id===B.beanId),B.p);
 const ex=extractOne(rb,{d:B.d,temp:B.temp,time:Math.max(.1,t),agit:METH[B.method].agit});
 const liquid=Math.max(1,B.water-B.dose*METH[B.method].retain);
 const mg={};let total=0;
 CLASSES.forEach(([k,,,keys])=>{let m=0;keys.forEach(kk=>{m+=(ex[kk]||0)*B.dose;});mg[k]=m;total+=m;});
 const sim={ey:total/(B.dose*1000)*100,tds:total/(liquid*1000)*100,liquid,conc:{},volC:{},volT:0,solidsMg:total,cup:[]};
 ["citric","malic","acetic","quinic","cga","lactone","phenyl","sucrose","caramel","poly","caffeine","lipid"].forEach(k=>sim.conc[k]=(ex[k]||0)*B.dose/liquid);
 Object.keys(ex.vol||{}).forEach(k=>{sim.volC[k]=ex.vol[k]*B.dose/liquid;sim.volT+=sim.volC[k];});
 return {mg,total,ey:sim.ey,tds:sim.tds,per:perceive(sim,{kh:25}),liquid,dp:ex._d};
}

function phaseOf(t){
 if(B.method==="press"){
  if(t<15)return["投入","粉と湯が触れた瞬間から、表面の酸と糖が溶け始めます。"];
  if(t<60)return["脱ガスと浸潤","二酸化炭素が抜け、その隙間に水が入ります。泡が止まるまでは、まだ表面しか抽出されていません。"];
  if(t<180)return["浸漬","全ての粒が同じ湯に浸かるため、粒径のばらつきがそのまま味のばらつきになります。細かい粒はもう出し切り、粗い粒はまだ途中です。"];
  return["プレスと分離","押し切った後も微粉から成分が出続けます。サーバーへ移さないと苦味が伸びます。"];
 }
 if(B.method==="siphon"){
  if(t<30)return["加熱","フラスコの空気と水蒸気が膨張し、圧力で湯が上のロートへ押し上げられます。"];
  if(t<100)return["上部での浸漬","湯が上に留まる間は温度が下がりにくく、苦味成分の抽出が進みやすい方式です。"];
  return["下降","火を止めると水蒸気が凝縮して圧力が下がり、大気圧に押されて抽出液が濾過材を通って落ちます。"];
 }
 if(t<6)return["濾紙を湿らせる","乾いた濾紙は水を吸い、紙の匂いも出します。粉を入れる前に湯を通すのはこのためです。"];
 if(t<50)return["蒸らし（脱ガス）","焙煎で内部にたまった二酸化炭素が押し出され、粉が膨らみます。ガスが抜けた隙間に水が入り、ここで初めて内部の成分に手が届きます。"];
 if(t<105)return["抽出前半：酸と糖","小さい分子ほど早く溶けます。クエン酸・リンゴ酸と糖類がこの時間帯に多く出ます。ここで止めると、明るいが薄い液になります。"];
 if(t<152)return["抽出後半：苦味と厚み","遅れて溶ける成分（ラクトン、キナ酸、多糖）が増えます。コクと苦味はここで作られます。"];
 return["落としきり","粉層に残った液が抜けます。長引くと微粉から渋みが出ます。"];
}

function seriesSVG(){
 const N=30,w=380,h=112,pts={};CLASSES.forEach(([k])=>pts[k]=[]);
 for(let i=0;i<=N;i++){const s=stateAt(Math.max(.5,B.total*i/N)),tot=s.total||1;let acc=0;
  CLASSES.forEach(([k])=>{acc+=s.mg[k]/tot;pts[k].push([i/N,acc]);});}
 let layers="";
 CLASSES.forEach(([k,l,c],idx)=>{const up=pts[k],lo=idx===0?up.map(([x])=>[x,0]):pts[CLASSES[idx-1][0]];
  layers+=`<path d="M${up.map(([x,y])=>`${(16+x*(w-26)).toFixed(1)},${(h-10-y*(h-24)).toFixed(1)}`).join(" L")} L${lo.slice().reverse().map(([x,y])=>`${(16+x*(w-26)).toFixed(1)},${(h-10-y*(h-24)).toFixed(1)}`).join(" L")} Z" fill="${c}" opacity=".8"/>`;});
 const now=clamp(B.t/B.total,0,1);
 return `<svg viewBox="0 0 ${w} ${h+16}" width="100%" role="img" aria-label="時間ごとのカップ内成分比率">
  <rect width="${w}" height="${h+16}" fill="#fff"/>${layers}
  <line x1="${16+now*(w-26)}" y1="4" x2="${16+now*(w-26)}" y2="${h-8}" stroke="#16262A" stroke-width="1.5"/>
  ${DG.label(16,h+12,"0:00")}${DG.label(w-10,h+12,`${String(Math.floor(B.total/60)).padStart(2,"0")}:${String(B.total%60).padStart(2,"0")}`,"end")}</svg>`;
}

 $("#liveBars").innerHTML=[["酸味",s.per.acidity],["苦味",s.per.bitterness],["甘さ",s.per.sweetness],["コク",s.per.body],["香り",s.per.aroma]]
  .map(([l,v])=>`<div style="display:grid;grid-template-columns:46px 1fr 34px;gap:8px;align-items:center;font-size:13.5px;margin-bottom:7px">

 const tot=s.total||1;
 $("#cupComp").innerHTML=`<p class="note">カップ内の成分（収率 ${s.ey.toFixed(1)}%／濃度 ${s.tds.toFixed(2)}%）</p>
  <div style="display:flex;height:18px;margin-top:5px;border:1px solid var(--line);border-radius:3px;overflow:hidden">${CLASSES.map(([k,l,c])=>`<div style="width:${s.mg[k]/tot*100}%;background:${c}"></div>`).join("")}</div>
  <div class="legend">${CLASSES.map(([k,l,c])=>`<span><i style="background:${c}"></i>${l.split("（")[0]} ${(s.mg[k]/tot*100).toFixed(0)}%</span>`).join("")}</div>
  <div style="margin-top:10px">${seriesSVG()}</div>
  <p class="note">左（序盤）ほど酸と糖、右へ行くほど苦味と厚み。縦線が現在です。カップ内固形分の約6割は、味の主役ではなく液体の厚みを作る多糖類です。</p>`;
}
function togglePlay(){
 B.playing=!B.playing;$("#play").textContent=B.playing?"❚❚ 一時停止":"▶ 再生";
 if(B.playing){let last=performance.now();
  const loop=now=>{if(!B.playing)return;const dt=(now-last)/1000;last=now;B.t=Math.min(B.total,B.t+dt*B.speed);draw();
   if(B.t>=B.total){B.playing=false;$("#play").textContent="▶ 再生";return;}raf=requestAnimationFrame(loop);};
  raf=requestAnimationFrame(loop);} else if(raf)cancelAnimationFrame(raf);
}

    <li>話題ではなく作用で分類します。同じ関税の記事でも、価格に効くのか流通経路に効くのかで別の棚に入れます。</li>
    <li>時間差を明記します。相場は数週間、天候は1〜2年、気候研究は数十年。効くまでの距離が違うものを同じ列に並べません。</li>
    <li>「あなたへの影響」を必ず一行書きます。書けない記事は載せません。載せる価値がないという判断そのものが編集です。</li>
    <li>確度ラベルを付けます。一次情報、査読論文、業界メディア、業者発信の順に扱いを変えます。</li>
    <li>訂正履歴を残します。数値が改訂されたら、消さずに取り消し線で残します。</li>
   </ol>

const RENDER={news:renderNews,brew:renderBrew,tips:renderTips};
function go(t){B.playing=false;if(raf)cancelAnimationFrame(raf);
 $$(".pane").forEach(p=>p.classList.toggle("on",p.id==="p-"+t));
 $$("#tabs button").forEach(b=>b.setAttribute("aria-current",String(b.dataset.tab===t)));
 RENDER[t]();window.scrollTo(0,0);}
function init(){
 $("#tabs").innerHTML=`<a href="index.html">表紙</a><a href="soil-to-cup.html">土から一杯まで</a>`
  +TABS.map(([id,l])=>`<button data-tab="${id}" aria-current="${id==="tips"}">${l}</button>`).join("");
 $$("#tabs button").forEach(b=>b.onclick=()=>go(b.dataset.tab));
 renderTips();
}
document.addEventListener("DOMContentLoaded",init);
})();
